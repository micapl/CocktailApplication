name: Generate PlantUML Diagrams

# Only runs with changes in .puml files
on:
  push:
    branches:
      - '**' #runs on any branch
    paths:
      - '**.puml'
      - 'docs/diagrams/**'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Render PlantUML Diagrams to SVG
        uses: titarenko/plantuml-action@v1
        with:
          source-path: 'docs/diagrams'
          format: 'svg'

      - name: Commit and Push rendered SVG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: auto-generate SVG diagrams [skip ci]"
          file_pattern: 'docs/diagrams/*.svg'